<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03 · Lovely Garden | Tangy Cat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
      background: #edf2e6;
      color: #3b3335;
    }
    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      text-align: center;
    }
    .card {
      width: min(100%, 420px);
      background: rgba(255,255,255,.88);
      border-radius: 28px;
      padding: 56px 24px;
      box-shadow: 0 14px 40px rgba(80,55,60,.08);
    }
    .eyebrow { font-size: 12px; letter-spacing: .18em; margin-bottom: 14px; }
    h1 { margin: 0 0 12px; font-size: 30px; }
    p { margin: 0 0 28px; line-height: 1.7; color: #766b6e; }
    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 999px;
      background: #d98fa1;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="eyebrow">TANGY CAT WEDDING INVITATION</div>
      <h1>03 · Lovely Garden</h1>
      <p>이 폴더의 <strong>index.html</strong>을 실제 모바일 청첩장 샘플 파일로 교체하면 됩니다.</p>

    </section>
  </main>
